<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TradeWars | {{ title }}</title>
    {% block extra_css %}{% endblock %}
    <style>
        /* Minimal base styles to ensure child CSS renders correctly */
        html, body { height: 100%; margin: 0; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: #f6f8fb; color: #1f2937; }
        .topbar { background: linear-gradient(135deg,#1e40af 0%,#1e3a8a 100%); color: #fff; padding: 12px 20px; display:flex; align-items:center; gap:12px; }
        .container { max-width:1200px; margin:24px auto; padding:0 16px; }
        a.nav { color: #fff; text-decoration:none; font-weight:700 }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="/team/dashboard" class="nav">🏴 TradeWars</a>
        <nav style="margin-left:16px; display:flex; gap:12px;">
            <a href="/team/dashboard" class="nav">Dashboard</a>
            <a href="/team/stocks" class="nav">Browse Stocks</a>
            <a href="/team/portfolio" class="nav">Portfolio</a>
            <a href="/team/news" class="nav">News</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align:center; padding:24px 0; color:#6b7280; font-size:0.9rem;">
        © TradeWars - Good luck with your competition
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
